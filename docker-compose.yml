# The whole stack in Docker: a local chain, the contracts deployed on it, and the frontend.
#   docker compose up --build     then open http://localhost:8080
#   docker compose down           stops everything (the chain is kept in the anvil-data volume)
#   docker compose down -v        also deletes the chain

# Anvil deploys to the same addresses every time on a fresh chain (they depend only on the
# deployer's address and nonce), so they can be written here and built into the frontend.
x-addresses:
  token: &token "0x5FbDB2315678afecb367f032d93F642f64180aa3"
  vault: &vault "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"

services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.7.0
    entrypoint: ["anvil", "--host", "0.0.0.0", "--state", "/data/state.json"]
    init: true # forwards Ctrl+C / docker stop to Anvil, so it saves the chain before exiting
    ports:
      - "8545:8545" # MetaMask runs in your browser, outside Docker, so the chain must be reachable from the host
    volumes:
      - anvil-data:/data
    healthcheck:
      test: ["CMD", "cast", "block-number"]
      interval: 1s
      retries: 30

  deploy:
    build: . # Dockerfile in the repo root: the contracts, compiled at build time
    depends_on:
      anvil:
        condition: service_healthy
    environment:
      RPC_URL: http://anvil:8545 # inside Docker's network, containers reach each other by service name
      PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80" # Anvil's public test key #0
      VAULT_ADDRESS: *vault

  frontend:
    build:
      context: ./frontend
      args: # Vite builds these into the JavaScript files, so they're needed at build time
        VITE_RPC_URL: http://127.0.0.1:8545 # used by your browser, so it's the host address, not http://anvil:8545
        VITE_CHAIN_ID: "31337"
        VITE_TOKEN_ADDRESS: *token
        VITE_VAULT_ADDRESS: *vault
    depends_on:
      deploy:
        condition: service_completed_successfully
    ports:
      - "8080:80"

volumes:
  anvil-data: